# ============================================================
# HRIS Infrastructure & Monitoring Stack
# - Database:      MariaDB 10.4 running on port 3306 (replaces XAMPP MySQL)
# - Prometheus:    collects metrics from the PHP exporter sidecar
# - Grafana:       visualizes metrics with a pre-built dashboard
# - hris-exporter: PHP-CLI server running metrics.php inside Docker
#
# Usage:
#   cd monitoring
#   docker compose up -d
#
# Access:
#   Database   → localhost:3306         (user: root / password: [empty])
#   Grafana    → http://localhost:3000  (user: admin / password: hris@admin)
#   Prometheus → http://localhost:9090
#   Metrics    → http://localhost:9091/monitoring/metrics.php
# ============================================================

services:

  # ----------------------------------------------------------
  # MySQL / MariaDB database service — stores HRIS data in Docker,
  # eliminating the need to run MySQL inside XAMPP.
  # Preloads database/docker_init.sql on initial volume creation.
  # ----------------------------------------------------------
  db:
    image: mariadb:10.4
    container_name: hris_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hris
    volumes:
      - db_data:/var/lib/mysql
      - ../database/docker_init.sql:/docker-entrypoint-initdb.d/01_docker_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monitoring

  # ----------------------------------------------------------
  # PHP metrics exporter — runs metrics.php INSIDE Docker so
  # Prometheus can scrape it without Windows Firewall issues.
  # Mounts the project root read-only.
  # ----------------------------------------------------------
  hris-exporter:
    # Built from monitoring/exporter/Dockerfile (pdo_mysql pre-installed)
    build:
      context: ./exporter
    image: hris-exporter:latest
    container_name: hris_exporter
    restart: unless-stopped
    ports:
      # Bound to localhost only: the metrics are for this machine, not the LAN
      - "127.0.0.1:9091:9091"
    volumes:
      - ../:/app:ro
    working_dir: /app
    environment:
      DB_HOST: ${HRIS_DB_HOST:-db}
      DB_PORT: ${HRIS_DB_PORT:-3306}
      DB_NAME: ${HRIS_DB_NAME:-hris}
      DB_USER: ${HRIS_DB_USER:-root}
      DB_PASS: ${HRIS_DB_PASS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9091/monitoring/metrics.php') ? 0 : 1);"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring

  # ----------------------------------------------------------
  # Realtime WebSocket server — broadcasts live leave updates
  # and serves /metrics for Prometheus monitoring.
  # ----------------------------------------------------------
  hris-realtime:
    build:
      context: ../realtime
    image: hris-realtime:latest
    container_name: hris_realtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      HRIS_REALTIME_SECRET: ${HRIS_REALTIME_SECRET:-F4HBp1jQJ4c1b1hJj8Q2AyHWUnbJ9FwPS7mnT0VPKxh9I6vs}
      PORT: 8090
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8090/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      monitoring:
        aliases:
          - hris-realtime

  prometheus:
    image: prom/prometheus:latest
    container_name: hris_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - hris-exporter
      - hris-realtime
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: hris_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hris@admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  db_data:
    driver: local

networks:
  monitoring:
    driver: bridge
